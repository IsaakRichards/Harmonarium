name: Build

# Every push to main builds Linux, Windows and Android files as run artifacts.
# Push a tag like v0.2.0 to also publish them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Starborn ${{ github.ref_name }}
          releaseBody: Starborn downloads for Linux (.AppImage / .deb / .rpm), Windows (.msi / -setup.exe) and Android (.apk).
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: Starborn-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.0.12077973
      BUILD_TOOLS: 34.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK and build tools
        run: sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}" "platforms;android-34"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm install

      - name: Generate the Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d src-tauri/gen/android ]; then npx tauri android init --ci; fi
          npx tauri icon app-icon.png

      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --apk --ci

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -n 1)
          echo "Unsigned APK: $APK"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > release.jks
            STOREPASS="$ANDROID_KEYSTORE_PASSWORD"; ALIAS="$ANDROID_KEY_ALIAS"; KEYPASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, so this APK is signed with a throwaway key. Updates from a later build won't install over it. See README."
            keytool -genkeypair -keystore release.jks -alias sb -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Starborn"
            STOREPASS=android; ALIAS=sb; KEYPASS=android
          fi
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$ALIAS" --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" \
            --out Starborn.apk aligned.apk
          "$BT/apksigner" verify Starborn.apk
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: Starborn-Android
          path: Starborn.apk

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Starborn.apk
          name: Starborn ${{ github.ref_name }}
