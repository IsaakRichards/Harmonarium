name: Linux

# Builds the Linux packages: .AppImage (runs anywhere), .deb (Debian/Ubuntu/Mint), .rpm (Fedora).
# Runs on every push to main, on pull requests, by hand, and from release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'sync/**', '.github/workflows/release.yml']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the build (e.g. v0.3.0); release.yml passes the tag
        type: string
        required: false

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  build:
    name: Linux (x64)
    # 22.04 on purpose: an AppImage built on an older glibc runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the release version
        if: inputs.version
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm install

      # With the updater signing key set (see README), also build the signed update files
      # (.sig) that the in-app updater checks. Without it the build is the same as before.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles appimage,deb,rpm --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY secret, so no signed update files. See README."
            npx tauri build --bundles appimage,deb,rpm
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Starborn-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
