name: Reader test

# Runs the reader with the real epub.js in headless Chromium and checks page turns frame by
# frame (slide, finger drag, fade, none). Screenshots are kept as the run's artifact.
on:
  push:
    branches: [main]
    paths: ['src/**', 'index.html', 'tests/**', 'package.json', 'vite.config.js', '.github/workflows/reader-test.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: reader-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Reader (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build and test
        run: npm run test:reader

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-test-results
          path: test-results/
          if-no-files-found: ignore
