name: Windows

# Builds the Windows installers: -setup.exe (NSIS, per-user, no admin needed) and .msi.
# Runs on every push to main, on pull requests, by hand, and from release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'sync/**', '.github/workflows/release.yml']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the build (e.g. v0.3.0); release.yml passes the tag
        type: string
        required: false

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  build:
    name: Windows (x64) · ${{ matrix.flavor == 'solo' && 'Scriptorium' || 'Harmonarium' }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [harmonarium, solo]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the release version
        if: inputs.version
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      # Harmonarium, or Scriptorium (the standalone ReadEra-style reader). See src/flavor.js.
      - name: Pick the app
        run: node scripts/flavor.mjs ${{ matrix.flavor }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm install

      # Scriptorium has its own icon (app-icon-solo.png, copied over app-icon.png by flavor.mjs).
      - name: App icons
        if: matrix.flavor == 'solo'
        run: npx tauri icon app-icon.png

      # With the updater signing key set (see README), also build the signed update files
      # (.sig) that the in-app updater checks. Without it the build is the same as before.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ "${{ matrix.flavor }}" = "harmonarium" ]; then
            npx tauri build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY secret, so no signed update files. See README."
            npx tauri build --bundles nsis,msi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor == 'solo' && 'Scriptorium' || 'Harmonarium' }}-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error
