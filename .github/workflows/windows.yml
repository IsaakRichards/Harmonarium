name: Windows

# Builds the Windows installers: -setup.exe (NSIS, per-user, no admin needed) and .msi.
# Runs on every push to main, on pull requests, by hand, and from release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'sync/**', '.github/workflows/release.yml']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the build (e.g. v0.3.0); release.yml passes the tag
        type: string
        required: false

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  build:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the release version
        if: inputs.version
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm install

      - name: Build
        run: npx tauri build --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: Starborn-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
