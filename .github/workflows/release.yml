name: Release

# Push a tag like v0.2.0 to build every platform and publish one GitHub release with all files:
#   git tag v0.2.0 && git push origin v0.2.0
# Or run it by hand from the Actions tab and give it a tag name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (created on the current commit if it doesn't exist)
        required: true

permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
    secrets: inherit
    with:
      version: ${{ inputs.tag || github.ref_name }}
  windows:
    uses: ./.github/workflows/windows.yml
    secrets: inherit
    with:
      version: ${{ inputs.tag || github.ref_name }}
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      version: ${{ inputs.tag || github.ref_name }}
  sailfish:
    uses: ./.github/workflows/sailfish.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}

  publish:
    name: Publish release
    needs: [linux, windows, android, sailfish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The desktop artifacts keep their bundle subfolders (appimage/, deb/, nsis/, …);
      # flatten everything into one folder so every file gets attached.
      - name: Gather files
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          ls -la release

      - uses: actions/checkout@v4
        with:
          path: repo

      # latest.json tells the desktop in-app updater where the signed update files are.
      - name: Updater manifest
        run: node repo/scripts/latest-json.mjs release "${{ inputs.tag || github.ref_name }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Starborn ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            **Which file do I want?**
            - **Android:** `Starborn.apk`
            - **Sailfish OS:** `harbour-starborn-…aarch64.rpm` (newer phones) or `…armv7hl.rpm` (older ones)
            - **Windows:** `Starborn_…_x64-setup.exe` (or the `.msi`)
            - **Linux:** `.AppImage` runs on any distro · `.deb` for Ubuntu/Mint/Debian · `.rpm` for Fedora
          files: release/*
