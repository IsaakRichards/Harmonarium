name: Release

# Push a tag like v0.2.0 to build every platform and publish one GitHub release with all files:
#   git tag v0.2.0 && git push origin v0.2.0
# Or run it by hand from the Actions tab and give it a tag name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (created on the current commit if it doesn't exist)
        required: true
      platforms:
        description: Build every platform, or Android only (for an Android-only fix)
        type: choice
        options: [all, android]
        default: all

permissions:
  contents: write

jobs:
  linux:
    if: inputs.platforms != 'android'
    uses: ./.github/workflows/linux.yml
    secrets: inherit
    with:
      version: ${{ inputs.tag || github.ref_name }}
  windows:
    if: inputs.platforms != 'android'
    uses: ./.github/workflows/windows.yml
    secrets: inherit
    with:
      version: ${{ inputs.tag || github.ref_name }}
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      version: ${{ inputs.tag || github.ref_name }}
  sailfish:
    if: inputs.platforms != 'android'
    uses: ./.github/workflows/sailfish.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}

  publish:
    name: Publish release
    needs: [linux, windows, android, sailfish]
    # Platforms left out (an Android-only release) count as skipped, not failed.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The desktop artifacts keep their bundle subfolders (appimage/, deb/, nsis/, …);
      # flatten everything into one folder so every file gets attached.
      - name: Gather files
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          ls -la release

      - uses: actions/checkout@v4
        with:
          path: repo

      # latest.json tells the desktop in-app updater where the signed update files are.
      - name: Updater manifest
        run: node repo/scripts/latest-json.mjs release "${{ inputs.tag || github.ref_name }}"

      # An Android-only release becomes the newest one, where the Windows/Linux updater looks for
      # latest.json. Carry over the previous release's, so desktop copies see they're up to date.
      - name: Keep the desktop updater's manifest
        if: inputs.platforms == 'android'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f release/latest.json ]; then
            gh release download --repo "${{ github.repository }}" --pattern latest.json --dir release || echo "no earlier latest.json"
          fi
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Harmonarium ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ${{ inputs.platforms == 'android' && '**Android only.** The other platforms are unchanged since the previous release.' || '' }}

            **Which file do I want?**
            - **Android:** `Harmonarium.apk`
            - **Sailfish OS:** `harbour-harmonarium-…aarch64.rpm` (newer phones) or `…armv7hl.rpm` (older ones)
            - **Windows:** `Harmonarium_…_x64-setup.exe` (or the `.msi`)
            - **Linux:** `.AppImage` runs on any distro · `.deb` for Ubuntu/Mint/Debian · `.rpm` for Fedora
          files: release/*
