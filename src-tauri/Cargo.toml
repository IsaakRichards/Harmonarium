[package]
name = "starborn"
version = "0.2.0"
description = "Starborn: EPUB reader and reading tracker synced through Google Sheets"
authors = ["Isaak Richards"]
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "starborn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
