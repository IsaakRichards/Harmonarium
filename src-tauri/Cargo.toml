[package]
name = "harmonarium"
version = "0.2.0"
description = "Harmonarium: EPUB reader and reading tracker synced through Google Sheets"
authors = ["Isaak Richards"]
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "harmonarium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
# tauri::generate_context! writes the plugins section of tauri.conf.json as serde_json values.
serde_json = "1"

# In-app updates on Windows and Linux (AppImage); .deb/.rpm installs open the releases page instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# Adding a whole folder of books: the system's folder chooser (src/lib.rs, pick_book_folder).
tauri-plugin-dialog = "2"
